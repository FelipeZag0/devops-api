AWSTemplateFormatVersion: "2010-09-09"
Description: Infraestrutura para a devops-api — VPC, subnet publica, security group e instancia EC2

# ============================================================
# PARAMETROS — todos os valores configuráveis da stack
# ============================================================
Parameters:
  ProjectName:
    Type: String
    Default: devops-api
    Description: Prefixo usado nos nomes dos recursos

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Ambiente de deploy

  InstanceType:
    Type: String
    Default: t3.micro
    Description: Tipo da instancia EC2 (t3.micro = elegivel ao Free Tier em contas novas)

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Nome do par de chaves EC2 para acesso SSH (deploy via CD)

  AmiId:
    Type: String
    Default: ami-0c02fb55956c7d316
    Description: AMI Amazon Linux 2 (us-east-1)

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: Bloco CIDR da VPC

  SubnetCidr:
    Type: String
    Default: 10.0.1.0/24
    Description: Bloco CIDR da subnet publica

  SshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR autorizado a acessar a instancia via SSH (restrinja em producao)

# ============================================================
# RECURSOS
# ============================================================
Resources:

  # --- VPC: rede isolada que contem todos os recursos ---
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"
        - Key: Environment
          Value: !Ref Environment

  # --- Subnet publica: sub-rede com acesso direto a internet ---
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-subnet"
        - Key: Environment
          Value: !Ref Environment

  # --- Internet Gateway: porta de saida/entrada da VPC para a internet ---
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"

  # --- Associa o Internet Gateway à VPC ---
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # --- Tabela de rotas: direciona trafego da subnet para o IGW ---
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rtb"

  # --- Rota padrao: todo trafego (0.0.0.0/0) sai pelo Internet Gateway ---
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # --- Associa a subnet publica à tabela de rotas ---
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # --- Security Group: firewall da instancia — libera SSH (22) e API (8000) ---
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acesso SSH e API
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sg"
        - Key: Environment
          Value: !Ref Environment

  # --- Instancia EC2: servidor que executa a API via Docker ---
  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref ApiSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y docker git
          systemctl start docker
          systemctl enable docker
          usermod -aG docker ec2-user
          # instala o plugin Docker Compose v2 (necessario para o deploy via CD)
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          # clona o repo e sobe a API via compose (imagem publicada no Docker Hub)
          git clone https://github.com/FelipeZag0/devops-api.git /home/ec2-user/devops-api
          cd /home/ec2-user/devops-api
          DOCKERHUB_USERNAME=felipezag0 docker compose up -d
          chown -R ec2-user:ec2-user /home/ec2-user/devops-api
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-instance"
        - Key: Environment
          Value: !Ref Environment

# ============================================================
# OUTPUTS — valores exportados apos criacao da stack
# ============================================================
Outputs:
  InstanceId:
    Description: ID da instancia EC2
    Value: !Ref ApiInstance

  InstancePublicIp:
    Description: IP publico da instancia EC2
    Value: !GetAtt ApiInstance.PublicIp

  ApiUrl:
    Description: URL de acesso a API
    Value: !Sub "http://${ApiInstance.PublicIp}:8000"

  VpcId:
    Description: ID da VPC criada
    Value: !Ref VPC
